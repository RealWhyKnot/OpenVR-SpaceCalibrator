name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          prerelease-suffix: 'beta'

      - name: Script self-tests
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-AssertNoUpstreamReferences.ps1

      - name: Build and test
        shell: pwsh
        run: |
          cmake -A x64 -B build -S . -Wno-dev "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DSPACECAL_VERSION=${{ steps.tag.outputs.version }}" "-DSPACECAL_CHANNEL=${{ steps.tag.outputs.channel }}"
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }

      - name: Install NSIS
        shell: pwsh
        run: |
          $want = 'v3.12'
          $have = ''
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (Test-Path -LiteralPath $exe) { $have = (& $exe /VERSION) }
          if ($have -ne $want) {
            choco install nsis --version 3.12.0 --force -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "OpenVR-SpaceCalibrator-${{ steps.tag.outputs.version }}"
          ./.github/scripts/Stage-Package.ps1 -OutDir "build/$name"
          $zip = "build/$name.zip"
          Compress-Archive -Path "build/$name/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $name.zip`n", (New-Object System.Text.UTF8Encoding($false)))
          $sizeMiB = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 2)
          $viversion = ('${{ steps.tag.outputs.version }}' -split '-')[0]
          $setupName = "OpenVR-SpaceCalibrator-Setup-${{ steps.tag.outputs.version }}.exe"
          $setupPath = Join-Path $PWD "build\$setupName"
          $payload = Join-Path $PWD "build\$name"
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 /WX "/DVERSION=${{ steps.tag.outputs.version }}" "/DVIVERSION=$viversion" "/DPAYLOAD=$payload" "/DOUTFILE=$setupPath" installer/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$setupPath.sha256", "$setupHash  $setupName`n", (New-Object System.Text.UTF8Encoding($false)))
          $setupSizeMiB = [math]::Round((Get-Item -LiteralPath $setupPath).Length / 1MB, 2)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip=$zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name.zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "size=$sizeMiB"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setup=build/$setupName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setupname=$setupName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setupsize=$setupSizeMiB"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "setupsha256=$setupHash"

      - name: Installer smoke test
        shell: pwsh
        run: |
          ./.github/scripts/Test-Installer.ps1 -Setup '${{ steps.package.outputs.setup }}' -Version '${{ steps.tag.outputs.version }}'

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          title: Space Calibrator ${{ env.RELEASE_TAG }}
          extra: |
            ### Download

            - `${{ steps.package.outputs.setupname }}` (${{ steps.package.outputs.setupsize }} MiB) - installer
            - SHA256 `${{ steps.package.outputs.setupsha256 }}`
            - `${{ steps.package.outputs.name }}` (${{ steps.package.outputs.size }} MiB) - portable zip
            - SHA256 `${{ steps.package.outputs.sha256 }}`

      - name: Check the notes for upstream references
        shell: pwsh
        run: ./.github/scripts/Assert-NoUpstreamReferences.ps1 -Path '${{ steps.notes.outputs.file }}'

      - name: Publish release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $extra = @()
          if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $extra = @('--prerelease', '--latest=false') }
          gh release create $tag '${{ steps.package.outputs.zip }}' '${{ steps.package.outputs.zip }}.sha256' '${{ steps.package.outputs.setup }}' '${{ steps.package.outputs.setup }}.sha256' --repo '${{ github.repository }}' --target '${{ steps.tag.outputs.sha }}' --title $tag --notes-file '${{ steps.notes.outputs.file }}' @extra
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }

      - name: Verify uploaded assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $expected = @{
            (Split-Path -Leaf '${{ steps.package.outputs.zip }}') = 'sha256:${{ steps.package.outputs.sha256 }}'
            '${{ steps.package.outputs.setupname }}' = 'sha256:${{ steps.package.outputs.setupsha256 }}'
          }
          $ok = $false
          for ($i = 0; $i -lt 6 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            $json = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
            $fetched = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if (-not $fetched) { continue }
            $release = $json | ConvertFrom-Json
            $matched = 0
            foreach ($assetName in $expected.Keys) {
              $asset = $release.assets | Where-Object { $_.name -eq $assetName }
              if ($asset -and $asset.digest -eq $expected[$assetName]) { $matched++ }
            }
            if ($matched -eq $expected.Count) { $ok = $true }
          }
          if (-not $ok) { throw "Uploaded asset digests do not match the built files." }
          Write-Host "Verified $($expected.Count) asset digests"

      - name: Remove partial release on failure
        if: failure()
        shell: pwsh
        run: |
          gh release delete $env:RELEASE_TAG --repo '${{ github.repository }}' --yes 2>$null
          $global:LASTEXITCODE = 0
